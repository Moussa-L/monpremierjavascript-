<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horloges Mondiales</title>

    <link rel="stylesheet" href="manipulationDate.css">
</head>

<body>

    <header class="app-header">
        <h1>Horloges & Date</h1>
        <p>Heure locale et fuseaux horaires mondiaux</p>
    </header>

    <main class="container">

        <!-- Carte Date -->
        <section class="clock-card">
            <h2>Date actuelle</h2>

            <p class="clock-value">
                <span id="annee"></span>
            </p>

            <p class="clock-subvalue">
                <span id="mois"></span>
            </p>
        </section>

        <!-- Carte Horloges -->
        <section class="clock-card">
            <h2>Heures mondiales</h2>

            <p class="clock-value">
                <span id="dateJour"></span>
            </p>

            <p class="clock-subvalue">
                <span id="heureLocal"></span>
            </p>

            <ul class="clock-list">
                
                <li>🇯🇵 Tokyo <span id="horlogeTokyo"></span></li>
                <li>🇾🇹 Mayotte <span id="horlogeMayotte"></span></li>
                <li>🇫🇷 Paris <span id="horlogeParis"></span></li>
                
            </ul>
        </section>

    </main>

    <footer class="app-footer">
        <p>© 2026 — Projet JavaScript Date & Time</p>
    </footer>

    <script src="manipulationDate.js" defer></script>
</body>
</html>
